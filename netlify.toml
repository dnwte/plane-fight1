# Netlify 部署配置
# 这是一个纯静态站点（无构建步骤）+ Netlify Functions

[build]
  # 静态文件发布目录：仓库根目录（index.html 所在位置）
  publish = "."
  # 无需构建，用 echo 当占位命令（空命令可能导致部署失败→site not found）
  command = "echo 'static site, no build step'"
  # Functions 目录：仓库根下的 functions/，会自动映射到 /.netlify/functions/
  functions = "functions"

# Node 版本通过环境变量设置（[functions] 表下没有 node_version 这个键）
[build.environment]
  NODE_VERSION = "18"
